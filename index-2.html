  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

for, and whatever is left at nine at night. Embla is designed around those.<\u002Fp>\n        <image-slot id=\"tuesday-photo\" radius=\"20\" fit=\"cover\" style=\"display:block; margin-top:28px; width:100%; max-width:300px; aspect-ratio:4/5;\" placeholder=\"A real woman, mid-ordinary-day — not a stock studio shot\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:1px; background:#E7D9D4; border:1px solid #E7D9D4; border-radius:22px; overflow:hidden; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 26%\">\n        <div style=\"background:#FFFFFF; padding:24px 26px; display:grid; grid-template-columns:78px 1fr; gap:20px; align-items:start\">\n          <div style=\"font-size:15px; font-weight:700; color:#3E8BB8; padding-top:1px\">6:10 am<\u002Fdiv>\n          <div>\n            <div style=\"font-size:16.5px; font-weight:600; letter-spacing:-0.01em; line-height:1.4\">Awake before you meant to be.<\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:14.5px; line-height:1.55; color:#6E5259\">One tap on the water widget. Dark mode, no brightness spike, no summary of yesterday you did not ask for.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:24px 26px; display:grid; grid-template-columns:78px 1fr; gap:20px; align-items:start\">\n          <div style=\"font-size:15px; font-weight:700; color:#8B7480; padding-top:1px\">9:15 am<\u002Fdiv>\n          <div>\n            <div style=\"font-size:16.5px; font-weight:600; letter-spacing:-0.01em; line-height:1.4\">Breakfast standing up, halfway out the door.<\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:14.5px; line-height:1.55; color:#6E5259\">Photograph the plate one-handed. Embla estimates the protein and waits for you to confirm it — which can be this afternoon, or never.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:24px 26px; display:grid; grid-template-columns:78px 1fr; gap:20px; align-items:start\">\n          <div style=\"font-size:15px; font-weight:700; color:#7A5A86; padding-top:1px\">9:40 pm<\u002Fdiv>\n          <div>\n            <div style=\"font-size:16.5px; font-weight:600; letter-spacing:-0.01em; line-height:1.4\">The first quiet of the day.<\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:14.5px; line-height:1.55; color:#6E5259\">Four things logged out of nine. Embla shows you the four. There is no bar left unfilled and nothing turns red.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F6EEEB; padding:22px 26px; font-size:14.5px; line-height:1.55; color:#6E5259\">Tomorrow you might log nothing at all. Embla is built to still be useful on the other side of that.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- what it tracks -->\n  <div style=\"background:#F6E1DE; border-bottom:1px solid #EBD3CF\">\n  <div id=\"tracks\" data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:104px 32px 96px\">\n    <div style=\"animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 24%\">\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#834E5C\">What Embla holds<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0; font-size:clamp(28px,5.2vw,44px); font-weight:700; letter-spacing:-0.028em; max-width:620px; line-height:1.06\">The things that actually move, in one place.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div data-r=\"stack\" style=\"margin-top:44px; display:grid; grid-template-columns:repeat(3, 1fr); gap:14px\">\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; transition:transform .16s ease-out, box-shadow .16s ease-out; animation:bloomPop .7s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 26%\" style-hover=\"transform:translateY(-3px); box-shadow:0 14px 32px rgba(61,50,56,.10)\">\n        <div style=\"width:38px; height:38px; border-radius:11px; background:#834E5C; color:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 4l2 2M17 7l-9 9-3 1 1-3 9-9zM14 6l4 4M10.5 9.5l1.5 1.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; font-size:18px; font-weight:600; letter-spacing:-0.01em\">Medication, if you take one<\u002Fdiv>\n        <p style=\"margin:9px 0 0; font-size:14.5px; line-height:1.55; color:#6E5259\">Log a weekly injectable and Embla counts down to the next one and tells you which site has rested longest. Hidden entirely if you don't need it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; transition:transform .16s ease-out, box-shadow .16s ease-out; animation:bloomPop .7s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 6% cover 26%\" style-hover=\"transform:translateY(-3px); box-shadow:0 14px 32px rgba(61,50,56,.10)\">\n        <div style=\"width:38px; height:38px; border-radius:11px; background:#8B7480; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700\">P<\u002Fdiv>\n        <div style=\"margin-top:18px; font-size:18px; font-weight:600; letter-spacing:-0.01em\">Protein and water first<\u002Fdiv>\n        <p style=\"margin:9px 0 0; font-size:14.5px; line-height:1.55; color:#6E5259\">Protein leads instead of calories, because it is what recovery, energy and holding onto muscle all lean on. Carbs, fat and hydration sit alongside it, not above it.<\u002Fp>\n        <div style=\"margin-top:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap\">\n          <span style=\"flex:none; width:22px; height:22px; border-radius:999px; background:#8B7480; color:#FFFFFF; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center\">P<\u002Fspan>\n          <span style=\"flex:none; width:22px; height:22px; border-radius:999px; border:2px solid #7A5A86; color:#7A5A86; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center\">K<\u002Fspan>\n          <span style=\"flex:none; width:22px; height:22px; border-radius:7px; background:#B4832F; color:#FFFFFF; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center\">C<\u002Fspan>\n          <span style=\"flex:none; width:22px; height:22px; clip-path:polygon(50% 4%, 96% 94%, 4% 94%); background:#C06B47; color:#FFFFFF; font-size:10px; font-weight:800; display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px\">F<\u002Fspan>\n          <span style=\"flex:none; width:22px; height:22px; border-radius:50% 50% 50% 5px; background:#3E8BB8; color:#FFFFFF; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center\">W<\u002Fspan>\n          <span style=\"flex:1 0 100%; font-size:12.5px; font-weight:500; color:#9A818A\">each with its own shape, not just a colour<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; transition:transform .16s ease-out, box-shadow .16s ease-out; animation:bloomPop .7s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 12% cover 26%\" style-hover=\"transform:translateY(-3px); box-shadow:0 14px 32px rgba(61,50,56,.10)\">\n        <div style=\"width:38px; height:38px; border-radius:11px; background:#3C7D5E; color:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 17l5-6 4 3 6-8\"><\u002Fpath><path d=\"M4 20.5h16\"><\u002Fpath><circle cx=\"19\" cy=\"6\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; font-size:18px; font-weight:600; letter-spacing:-0.01em\">Strength &amp; progress<\u002Fdiv>\n        <p style=\"margin:9px 0 0; font-size:14.5px; line-height:1.55; color:#6E5259\">Movement, energy and weight over 7 days to a year — shown as a trend you can read, not a verdict. Set a goal or don't; the chart works either way. Imports from Apple Health.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:28px; padding-top:24px; border-top:1px solid #E7D9D4\">\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259; margin-bottom:18px\">Also logged<\u002Fdiv>\n      <div data-r=\"stack\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:20px\">\n      <div style=\"display:flex; align-items:center; gap:9px\">\n        <span style=\"width:20px; height:20px; border-radius:50% 50% 50% 5px; background:#3E8BB8; color:#FFFFFF; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center\">W<\u002Fspan>\n        <span style=\"font-size:14.5px; font-weight:500; color:#3D3238\">Hydration, against a daily cup goal<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:9px\">\n        <span style=\"width:20px; height:20px; border-radius:6px; background:#7A5A86; color:#FFFFFF; display:flex; align-items:center; justify-content:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"13\" cy=\"4.5\" r=\"1.8\"><\u002Fcircle><path d=\"M11 21l2-6-3-3 1-4 3 3 3 1M10 12l-3 2-2 5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font-size:14.5px; font-weight:500; color:#3D3238\">Steps, exercise minutes, energy, workouts<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:9px\">\n        <span style=\"width:20px; height:20px; border-radius:6px; background:#F6EDDD; color:#A66412; display:flex; align-items:center; justify-content:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4l9 16H3z\"><\u002Fpath><path d=\"M12 10v4M12 17.2v.1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font-size:14.5px; font-weight:500; color:#3D3238\">Sleep, mood and how the day actually felt<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ACCENT BAND -->\n  <div data-r=\"mt\" style=\"margin-top:104px; background:#834E5C; color:#FFFFFF; position:relative; overflow:hidden\">\n    <div style=\"position:absolute; left:-80px; bottom:-220px; width:520px; height:520px; border-radius:999px; background:radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,0) 66%)\"><\u002Fdiv>\n    <div data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:96px 32px; position:relative; animation:bloomRise .9s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 26%\">\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#F6E1DE\">The premise<\u002Fdiv>\n      <h2 style=\"margin:22px 0 0; font-size:clamp(34px,7.2vw,66px); font-weight:700; letter-spacing:-0.035em; line-height:1.0; max-width:720px; text-wrap:balance\">Looking after yourself is not supposed to be a second job.<\u002Fh2>\n      <p style=\"margin:26px 0 0; font-size:18px; line-height:1.5; color:#F6E1DE; max-width:540px\">Most health apps are built for someone with an empty calendar and something to prove. Embla is built for the rest of us.<\u002Fp>\n      <div data-r=\"two\" style=\"margin-top:38px; display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(246,225,222,.25); border-radius:16px; overflow:hidden; max-width:900px\">\n        <div style=\"background:#834E5C; padding:20px 22px\"><div style=\"font-size:15px; font-weight:600; color:#FFFFFF; line-height:1.35\">Recovering<\u002Fdiv><div style=\"margin-top:6px; font-size:13.5px; line-height:1.5; color:#E7C6CC\">after a baby, surgery or illness<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#834E5C; padding:20px 22px\"><div style=\"font-size:15px; font-weight:600; color:#FFFFFF; line-height:1.35\">Training<\u002Fdiv><div style=\"margin-top:6px; font-size:13.5px; line-height:1.5; color:#E7C6CC\">and needing protein to actually add up<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#834E5C; padding:20px 22px\"><div style=\"font-size:15px; font-weight:600; color:#FFFFFF; line-height:1.35\">Managing<\u002Fdiv><div style=\"margin-top:6px; font-size:13.5px; line-height:1.5; color:#E7C6CC\">a condition or a medication schedule<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#834E5C; padding:20px 22px\"><div style=\"font-size:15px; font-weight:600; color:#FFFFFF; line-height:1.35\">Or just tired<\u002Fdiv><div style=\"margin-top:6px; font-size:13.5px; line-height:1.5; color:#E7C6CC\">of apps that shout at you about streaks<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SCREENS: staggered trio cropped by the section edge -->\n  <div id=\"screens\" style=\"background:#FDF7F5; overflow:hidden; border-bottom:1px solid #E7D9D4\">\n    <div data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:96px 32px 0\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:40px; flex-wrap:wrap; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 24%\">\n        <div>\n          <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#3E8BB8\">The app<\u002Fdiv>\n          <h2 style=\"margin:14px 0 0; font-size:clamp(27px,4.8vw,40px); font-weight:700; letter-spacing:-0.028em; line-height:1.08; max-width:520px\">Two taps, then back to your day.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15.5px; line-height:1.6; color:#6E5259; max-width:360px; margin:0\">The quick-log sheet reaches everything from any screen — the amount and the site are already filled in from last time. Light and dark both ship.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-r=\"phoneWrap pad\" style=\"max-width:1160px; margin:0 auto; padding:56px 32px 0; position:relative; height:604px\">\n      <div data-r=\"phoneStrip\" style=\"position:absolute; left:32px; top:56px; display:flex; align-items:flex-start; animation:bloomRise 1s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%\">\n\n        <!-- Dose -->\n        <div style=\"width:268px; height:544px; background:#F6EEEB; border-radius:36px; border:1px solid #E0CFC9; box-shadow:0 26px 60px rgba(61,50,56,.16); padding:5px; transform:rotate(-3.5deg); z-index:1\">\n          <div style=\"height:100%; border-radius:32px; overflow:hidden; background:#F6EEEB; display:flex; flex-direction:column; padding:16px 14px 0\">\n            <div style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; color:#9A818A\">DOSE<\u002Fdiv>\n            <div style=\"font-size:22px; font-weight:700; letter-spacing:-0.02em; margin-top:2px\">Next dose<\u002Fdiv>\n            <div style=\"margin-top:12px; background:#FFFFFF; border:1px solid #E7D9D4; border-radius:16px; padding:14px; display:flex; align-items:center; gap:14px\">\n              <div style=\"width:72px; height:72px; border-radius:999px; background:conic-gradient(#834E5C 0 0.71turn,#E7D9D4 0.71turn 1turn); display:flex; align-items:center; justify-content:center; flex:none\">\n                <div style=\"width:54px; height:54px; border-radius:999px; background:#FFFFFF; display:flex; flex-direction:column; align-items:center; justify-content:center\">\n                  <span style=\"font-size:17px; font-weight:700; line-height:1\">2d<\u002Fspan>\n                  <span style=\"font-size:8px; font-weight:700; letter-spacing:0.08em; color:#9A818A\">LEFT<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; color:#9A818A\">MONDAY<\u002Fdiv>\n                <div style=\"font-size:15px; font-weight:600; margin-top:3px\">Jul 27<\u002Fdiv>\n                <div style=\"font-size:12.5px; font-weight:500; color:#6E5259; margin-top:2px\">0.5 mg<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:11px; background:#FFFFFF; border:1px solid #E7D9D4; border-radius:16px; padding:14px\">\n              <div style=\"font-size:12px; font-weight:600; color:#9A818A; letter-spacing:0.06em\">LAST DOSE<\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:5px; margin-top:5px\"><span style=\"font-size:20px; font-weight:700\">0.5<\u002Fspan><span style=\"font-size:12.5px; color:#6E5259\">mg<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12px; color:#6E5259; margin-top:3px\">Thigh · left · Jul 17, 8:14 AM<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:5px; margin-top:9px; color:#3C7D5E; font-size:12.5px; font-weight:600\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg> Taken\n              <\u002Fdiv>\n us:999px; background:conic-gradient(#834E5C 0 0.68turn, #E7D9D4 0.68turn 1turn); display:flex; align-items:center; justify-content:center; flex:none; animation:bloomPop .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 34%\">\n            <div style=\"width:50px; height:50px; border-radius:999px; background:#F6EEEB; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700\">19<\u002Fdiv>\n          <\u002Fdiv>\n          <div><div style=\"font-size:13.5px; font-weight:600\">Days moved<\u002Fdiv><div style=\"font-size:12.5px; font-weight:500; color:#6E5259; margin-top:3px; line-height:1.4\">this month, up from 11<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F6EEEB; border-radius:14px; padding:17px\">\n          <div style=\"font-size:13.5px; font-weight:600\">Sleep<\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:9px; margin-top:5px\">\n            <span style=\"font-size:26px; font-weight:700\">5h 48m<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; font-weight:500; color:#3C7D5E; margin-top:3px\">↑ up 40m on last month<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#834E5C\">Progress<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0; font-size:clamp(27px,4.8vw,40px); font-weight:700; letter-spacing:-0.028em; line-height:1.08\">Your trend, without the verdict.<\u002Fh2>\n      <p style=\"margin:20px 0 0; font-size:16.5px; line-height:1.58; color:#6E5259; max-width:400px; text-wrap:pretty\">Weigh-ins from Apple Health or logged by hand, over 7 days to a year. Set a goal line if it helps; leave it off if it doesn't. Alongside it sit the things that move faster than the scale — how you slept, how often you moved, how you felt.<\u002Fp>\n      <p style=\"margin:16px 0 0; font-size:14.5px; line-height:1.6; color:#6E5259; max-width:400px\">Embla does not grade you, rank you against anyone, or use the word <em>should<\u002Fem>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- premium with screen crop -->\n  <div data-r=\"mt\" style=\"background:#F0E5E1; margin-top:104px\">\n  <div data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:96px 32px 96px; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 22%\">\n    <div style=\"display:flex; align-items:baseline; gap:12px; flex-wrap:wrap\">\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#834E5C\">Faster logging<\u002Fdiv>\n      <span style=\"background:#834E5C; color:#FFFFFF; border-radius:999px; padding:5px 11px; font-size:10.5px; font-weight:700; letter-spacing:0.08em\">PREMIUM AT LAUNCH<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"margin:14px 0 0; font-size:clamp(27px,4.8vw,40px); font-weight:700; letter-spacing:-0.028em; max-width:560px; line-height:1.08\">Two ways to skip the typing.<\u002Fh2>\n\n    <div data-r=\"stack\" style=\"margin-top:44px; display:grid; grid-template-columns:1fr 1fr; gap:14px\">\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; display:flex; gap:24px; align-items:flex-start; overflow:hidden\">\n        <div style=\"flex:1\">\n          <div style=\"width:38px; height:38px; border-radius:11px; background:#8B7480; color:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n            <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.4\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px; font-size:18px; font-weight:600; letter-spacing:-0.01em\">Meal photo scan<\u002Fdiv>\n          <p style=\"margin:9px 0 0; font-size:14.5px; line-height:1.55; color:#6E5259\">Photograph the plate and get a macro estimate you edit and confirm before it saves. Nothing is written to your log without you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width:168px; flex:none; background:#F6EEEB; border:1px solid #E7D9D4; border-radius:20px; padding:12px; margin-top:6px\">\n          <div style=\"height:74px; border-radius:12px; background:linear-gradient(135deg,#F0E5E1,#E0CFC9); display:flex; align-items:center; justify-content:center; color:#A86A4E\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.4\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px; display:flex; align-items:center; gap:6px\">\n            <span style=\"background:#F6EDDD; color:#A66412; border-radius:999px; padding:3px 8px; font-size:9.5px; font-weight:700; letter-spacing:0.06em\">ESTIMATE<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:9px; display:flex; flex-direction:column; gap:7px\">\n            <div style=\"display:flex; align-items:center; gap:7px\"><span style=\"width:15px; height:15px; border-radius:999px; background:#8B7480; color:#FFFFFF; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center\">P<\u002Fspan><span style=\"font-size:11px; font-weight:600; flex:1\">Protein<\u002Fspan><span style=\"font-size:11px; font-weight:600\">34 g<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:7px\"><span style=\"width:15px; height:15px; border-radius:5px; background:#B4832F; color:#FFFFFF; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center\">C<\u002Fspan><span style=\"font-size:11px; font-weight:600; flex:1\">Carbs<\u002Fspan><span style=\"font-size:11px; font-weight:600\">41 g<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:7px\"><span style=\"width:15px; height:15px; background:#C06B47; clip-path:polygon(50% 0,100% 100%,0 100%); flex:none\"><\u002Fspan><span style=\"font-size:11px; font-weight:600; flex:1\">Fat<\u002Fspan><span style=\"font-size:11px; font-weight:600\">12 g<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:11px; background:#834E5C; color:#FFFFFF; border-radius:9px; padding:8px 0; text-align:center; font-size:11px; font-weight:600\">Confirm &amp; save<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; display:flex; gap:24px; align-items:flex-start; overflow:hidden\">\n        <div style=\"flex:1\">\n          <div style=\"width:38px; height:38px; border-radius:11px; background:#3D3238; color:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n            <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 6v12M8 6v12M11.5 6v12M15 6v12M18.5 6v12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px; font-size:18px; font-weight:600; letter-spacing:-0.01em\">Barcode scan<\u002Fdiv>\n          <p style=\"margin:9px 0 0; font-size:14.5px; line-height:1.55; color:#6E5259\">Point the camera at a label and Embla looks it up in Open Food Facts, then fills the entry for you to check.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width:168px; flex:none; background:#3D3238; border-radius:20px; padding:14px; margin-top:6px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"height:74px; border-radius:12px; border:1.5px dashed rgba(246,225,222,.4); display:flex; align-items:center; justify-content:center; color:#F6E1DE\">\n            <svg width=\"70\" height=\"34\" sc-camel-view-box=\"0 0 70 34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M4 4v26M10 4v26M15 4v26M22 4v26M28 4v26M34 4v26M40 4v26M47 4v26M53 4v26M60 4v26M66 4v26\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"background:#2A2427; border-radius:12px; padding:11px\">\n            <div style=\"font-size:11px; font-weight:600; color:#F6E1DE\">Greek yogurt, plain<\u002Fdiv>\n            <div style=\"font-size:10px; color:#9A868C; margin-top:3px\">Open Food Facts<\u002Fdiv>\n            <div style=\"display:flex; gap:8px; margin-top:9px\">\n              <span style=\"font-size:10.5px; font-weight:600; color:#C79AA8\">17 g P<\u002Fspan>\n              <span style=\"font-size:10.5px; font-weight:600; color:#D6A94F\">6 g C<\u002Fspan>\n              <span style=\"font-size:10.5px; font-weight:600; color:#DB8E6C\">4 g F<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- dark privacy / AI -->\n  <div id=\"privacy\" data-r=\"pad\" style=\"background:#1E1A1C; color:#F6E1DE; padding:96px 32px\">\n    <div data-r=\"stack\" style=\"max-width:1160px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:start; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 24%\">\n      <div>\n        <div style=\"display:flex; align-items:center; gap:10px\">\n          <span style=\"width:34px; height:34px; border-radius:10px; background:#2E2429; color:#C79AA8; display:flex; align-items:center; justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z\"><\u002Fpath><path d=\"M9 12.5l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#C79AA8\">Insights &amp; privacy<\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"margin:20px 0 0; font-size:clamp(28px,5.2vw,44px); font-weight:700; letter-spacing:-0.03em; line-height:1.06; color:#F6E1DE\">Only derived numbers leave the app.<\u002Fh2>\n        <p style=\"margin:20px 0 0; font-size:16.5px; line-height:1.58; color:#C9B3B8; max-width:430px; text-wrap:pretty\">Insights and coach chat are consent-gated: you turn them on, and when you do, what goes to the model is a set of derived numbers. Not your medication names, not your notes, not your raw log rows.<\u002Fp>\n        <div style=\"margin-top:28px; display:flex; flex-wrap:wrap; gap:8px\">\n          <span style=\"background:#2E2429; color:#C79AA8; border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:600\">No medication names<\u002Fspan>\n          <span style=\"background:#2E2429; color:#C79AA8; border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:600\">No free-text notes<\u002Fspan>\n          <span style=\"background:#2E2429; color:#C79AA8; border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:600\">No raw rows<\u002Fspan>\n          <span style=\"background:#2E2429; color:#C79AA8; border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:600\">Off by default<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#2A2427; border:1px solid #423A3E; border-radius:18px; padding:28px\">\n        <div style=\"display:flex; align-items:center; gap:10px\">\n          <div style=\"width:27px; height:27px; border-radius:9px; background:#2E2429; color:#C79AA8; display:flex; align-items:center; justify-content:center\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:600; color:#F6E1DE; flex:1\">Insights &amp; coach chat<\u002Fdiv>\n          <span style=\"background:#2A2113; color:#E0A64B; border-radius:999px; padding:5px 10px; font-size:10.5px; font-weight:700; letter-spacing:0.06em\">IN DEVELOPMENT<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0; font-size:14.5px; line-height:1.55; color:#C9B3B8\">Weekly patterns across what you log, plus a chat you can ask about your own data. Waitlist members get it first.<\u002Fp>\n        <div style=\"margin-top:24px; display:flex; flex-direction:column; gap:1px; background:#423A3E; border-radius:14px; overflow:hidden\">\n          <div style=\"background:#2A2427; padding:15px 16px; display:flex; align-items:center; gap:12px\">\n            <div style=\"width:32px; height:32px; border-radius:10px; background:#2E2429; color:#C79AA8; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none\">P<\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"font-size:13.5px; font-weight:600; color:#F6E1DE\">Protein sits lower on dose days<\u002Fdiv><div style=\"font-size:11.5px; font-weight:500; color:#9A868C; margin-top:2px\">Last 4 weeks<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#2A2427; padding:15px 16px; display:flex; align-items:center; gap:12px\">\n            <div style=\"width:32px; height:32px; border-radius:10px; background:#2E2429; color:#C79AA8; display:flex; align-items:center; justify-content:center; flex:none\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 17l5-6 4 3 6-8\"><\u002Fpath><path d=\"M4 20.5h16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"font-size:13.5px; font-weight:600; color:#F6E1DE\">Weight change has been steady for 6 weeks<\u002Fdiv><div style=\"font-size:11.5px; font-weight:500; color:#9A868C; margin-top:2px\">Derived from your logged entries<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px; font-size:11.5px; font-weight:500; color:#9A868C; line-height:1.5\">Example wording. Insights describe what your logs show and are not medical advice.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- voices -->\n  <div data-r=\"mt\" style=\"background:#F6E1DE; border-top:1px solid #EBD3CF; border-bottom:1px solid #EBD3CF; margin-top:104px\">\n    <div data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:96px 32px; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 24%\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:40px; flex-wrap:wrap\">\n        <div>\n          <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#3C7D5E\">In their words<\u002Fdiv>\n          <h2 style=\"margin:14px 0 0; font-size:clamp(27px,4.8vw,40px); font-weight:700; letter-spacing:-0.028em; line-height:1.08; max-width:520px\">Women at very different points in it.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15.5px; line-height:1.6; color:#6E5259; max-width:340px; margin:0\">Shaped by women testing it through their own weeks — postpartum, training, managing a condition, or just trying to eat properly.<\u002Fp>\n      <\u002Fdiv>\n      <div data-r=\"stack\" style=\"margin-top:44px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px\">\n        <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <p style=\"margin:0; font-size:17px; line-height:1.55; color:#3D3238; letter-spacing:-0.01em; flex:1\">Quote from a real user goes here — ideally about a genuinely busy stretch, in her own words, unpolished.<\u002Fp>\n          <div style=\"display:flex; align-items:center; gap:12px\">\n            <image-slot id=\"voice-1\" shape=\"circle\" fit=\"cover\" style=\"display:block; width:44px; height:44px; flex:none;\" placeholder=\"Photo\"><\u002Fimage-slot>\n            <div><div style=\"font-size:14px; font-weight:600\">Name<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">Where she is in it<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <p style=\"margin:0; font-size:17px; line-height:1.55; color:#3D3238; letter-spacing:-0.01em; flex:1\">Quote from a real user goes here — something specific she uses it for, rather than praise.<\u002Fp>\n          <div style=\"display:flex; align-items:center; gap:12px\">\n            <image-slot id=\"voice-2\" shape=\"circle\" fit=\"cover\" style=\"display:block; width:44px; height:44px; flex:none;\" placeholder=\"Photo\"><\u002Fimage-slot>\n            <div><div style=\"font-size:14px; font-weight:600\">Name<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">Where she is in it<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <p style=\"margin:0; font-size:17px; line-height:1.55; color:#3D3238; letter-spacing:-0.01em; flex:1\">Quote from a real user goes here — one from a different life stage to the other two is worth including.<\u002Fp>\n          <div style=\"display:flex; align-items:center; gap:12px\">\n            <image-slot id=\"voice-3\" shape=\"circle\" fit=\"cover\" style=\"display:block; width:44px; height:44px; flex:none;\" placeholder=\"Photo\"><\u002Fimage-slot>\n            <div><div style=\"font-size:14px; font-weight:600\">Name<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">Where she is in it<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px; font-size:12.5px; font-weight:500; color:#6E5259\">Placeholder — send me the real quotes and photos and I will set them.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FAQ -->\n  <div id=\"faq\" data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:104px 32px 0; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 22%\">\n    <div data-r=\"stack\" style=\"display:grid; grid-template-columns:.72fr 1.28fr; gap:56px; align-items:start\">\n      <div>\n        <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#B4832F\">Before you sign up<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0; font-size:clamp(27px,4.8vw,40px); font-weight:700; letter-spacing:-0.028em; line-height:1.08\">Reasonable questions.<\u002Fh2>\n        <p style=\"margin:18px 0 0; font-size:15.5px; line-height:1.6; color:#6E5259; max-width:300px\">If yours isn't here — <a href=\"mailto:hello@embla.app\" style=\"font-weight:600\">hello@embla.app<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">Is this a weight loss app?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">Not unless you want it to be. Weight is one of several things Embla will track, and you can leave the goal line off entirely. Nothing in the app is framed as a target you are failing to hit, and there is no BMI verdict anywhere in it.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">I am not postpartum. Is this still for me?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">Yes. Embla is for women generally — the postpartum year is one of the harder stretches it is built to survive, not the only one it works in. Nothing in the app assumes you have had a baby, and you will not be asked about one.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">I am postpartum or breastfeeding. Does that change anything?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">You can tell Embla you are, and it adjusts what it shows you — protein and hydration move up the screen, and it stops surfacing anything that reads as a restriction. It will not tell you whether a medication is safe while feeding. That is a conversation for your prescriber, every time.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">I fell off it for three weeks. Does that matter?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">No. There is no streak to break and nothing turns red. Embla is built to still be useful on the other side of a bad month, which is the point at which most tracking apps become unopenable.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">Do I have to enter a medication?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">No. Embla works entirely without one. If you are on a weekly injectable, it will track the dose and rotate your sites for you — but that section stays hidden unless you turn it on. Nothing is verified against a pharmacy and nothing goes to your prescriber.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">Is any of it free?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">Yes. Everything in the app — nutrition, hydration, movement, sleep, mood, weight, and dose tracking if you use it — is free. Premium adds meal photo scanning and barcode lookup, the two shortcuts that save typing.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:22px; padding:22px 26px; animation:bloomPop .6s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 20%\">\n          <summary style=\"list-style:none; cursor:pointer; display:flex; align-items:center; gap:16px; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#3D3238\">\n            <span style=\"flex:1\">Is this medical advice?<\u002Fspan>\n            <span style=\"color:#834E5C; display:flex; flex:none\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.6; color:#6E5259; max-width:720px\">No. Embla is a tracking tool. Nutrition figures are estimates and labeled as estimates, and nothing in it replaces your GP, prescriber or care team.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- waitlist -->\n  <div id=\"waitlist\" data-r=\"pad\" style=\"max-width:1160px; margin:0 auto; padding:104px 32px\">\n    <div data-r=\"stack card\" style=\"background:linear-gradient(150deg,#FFFFFF,#F7E9EA); border:1px solid #E7D9D4; border-radius:28px; padding:56px 48px; box-shadow:0 1px 2px rgba(61,50,56,.04), 0 22px 52px rgba(61,50,56,.08); display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; animation:bloomRise .8s cubic-bezier(.2,.7,.2,1) both; animation-timeline:view(); animation-range:entry 0% cover 24%\">\n      <div>\n        <div id=\"bloomQuiz\">\n        <div style=\"display:flex; gap:6px; margin-bottom:26px\">\n          <span data-dot=\"\" style=\"width:34px; height:4px; border-radius:999px; background:#834E5C\"><\u002Fspan>\n          <span data-dot=\"\" style=\"width:34px; height:4px; border-radius:999px; background:#E7D9D4\"><\u002Fspan>\n          <span data-dot=\"\" style=\"width:34px; height:4px; border-radius:999px; background:#E7D9D4\"><\u002Fspan>\n          <span data-dot=\"\" style=\"width:34px; height:4px; border-radius:999px; background:#E7D9D4\"><\u002Fspan>\n        <\u002Fdiv>\n        <div data-step=\"1\" style=\"display:block\">\n          <div style=\"font-size:11.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259\">Coming to iOS · Question 1 of 3<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0; font-size:clamp(25px,4.6vw,34px); font-weight:700; letter-spacing:-0.028em; line-height:1.1; max-width:420px\">Where are you with it?<\u002Fh2>\n          <div style=\"margin-top:22px; display:flex; flex-direction:column; gap:9px; max-width:420px\">\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Starting from scratch<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Recovering from something<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Training for something<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Keeping something steady<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div data-step=\"2\" style=\"display:none\">\n          <div style=\"font-size:11.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259\">Question 2 of 3<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0; font-size:clamp(25px,4.6vw,34px); font-weight:700; letter-spacing:-0.028em; line-height:1.1; max-width:420px\">What is hardest right now?<\u002Fh2>\n          <div style=\"margin-top:22px; display:flex; flex-direction:column; gap:9px; max-width:420px\">\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Eating anything like enough<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Finding any time to move<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Sleep, or the lack of it<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Feeling like myself again<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-back=\"1\" style=\"margin-top:18px; font-size:13px; font-weight:600; color:#6E5259; cursor:pointer\">‹ Back<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-step=\"3\" style=\"display:none\">\n          <div style=\"font-size:11.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259\">Question 3 of 3<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0; font-size:clamp(25px,4.6vw,34px); font-weight:700; letter-spacing:-0.028em; line-height:1.1; max-width:420px\">Is there a medication you want tracked?<\u002Fh2>\n          <div style=\"margin-top:22px; display:flex; flex-direction:column; gap:9px; max-width:420px\">\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">A weekly injectable<\u002Fspan>\n              <span style=\"font-size:12.5px; font-weight:500; color:#6E5259\">dose &amp; sites<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Something daily<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">No, none<\u002Fspan>\n            <\u002Fdiv>\n            <div data-opt=\"\" style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:background .14s ease-out, border-color .14s ease-out\" style-hover=\"border-color:#834E5C\">\n              <span style=\"font-size:15px; font-weight:600; flex:1\">Rather not say<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-back=\"2\" style=\"margin-top:18px; font-size:13px; font-weight:600; color:#6E5259; cursor:pointer\">‹ Back<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-step=\"4\" style=\"display:none\">\n          <div style=\"font-size:11.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259\">Last step<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0; font-size:clamp(25px,4.6vw,34px); font-weight:700; letter-spacing:-0.028em; line-height:1.1; max-width:420px\">Where should we send your invite?<\u002Fh2>\n          <p style=\"margin:14px 0 0; font-size:15px; line-height:1.55; color:#6E5259; max-width:400px\">Setup takes about a minute, and you can skip any of it.<\u002Fp>\n          <div style=\"margin-top:22px; display:flex; flex-direction:column; gap:10px; max-width:450px\">\n            <div style=\"display:flex; gap:10px\">\n              <input type=\"email\" placeholder=\"you@email.com\" style=\"flex:1; height:50px; border:1px solid #E7D9D4; background:#FFFFFF; border-radius:12px; padding:0 15px; font-size:15px; color:#3D3238; outline:none\" style-focus=\"border:1.5px solid #834E5C\">\n              <button data-submit=\"\" style=\"height:50px; border:none; background:#834E5C; color:#FFFFFF; border-radius:12px; padding:0 24px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap; box-shadow:0 6px 18px rgba(131,78,92,.22)\" style-hover=\"background:#6E3F4C\">Join the waitlist<\u002Fbutton>\n            <\u002Fdiv>\n            <div data-note=\"\" style=\"font-size:12.5px; font-weight:500; color:#6E5259\">No spam, no sharing your address.<\u002Fdiv>\n          <\u002Fdiv>\n          <div data-back=\"3\" style=\"margin-top:18px; font-size:13px; font-weight:600; color:#6E5259; cursor:pointer\">‹ Back<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-step=\"5\" style=\"display:none\">\n          <div style=\"width:56px; height:56px; border-radius:999px; background:#E3EDE6; color:#3C7D5E; display:flex; align-items:center; justify-content:center\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h2 style=\"margin:20px 0 0; font-size:clamp(25px,4.6vw,34px); font-weight:700; letter-spacing:-0.028em; line-height:1.1\">You are on the list.<\u002Fh2>\n          <p style=\"margin:14px 0 0; font-size:15.5px; line-height:1.6; color:#6E5259; max-width:400px\">We will email you once — the day Embla is on the App Store. Nothing before that.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border:1px solid #E7D9D4; border-radius:24px; padding:28px\">\n        <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E5259\">What waitlist members get<\u002Fdiv>\n        <div style=\"margin-top:18px; display:flex; flex-direction:column; gap:1px; background:#E7D9D4; border-radius:14px; overflow:hidden\">\n          <div style=\"background:#FFFFFF; padding:15px 16px; display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"color:#834E5C; display:flex; padding-top:2px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div style=\"font-size:14px; font-weight:600\">A download link the day we ship<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">One email, then nothing until launch.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF; padding:15px 16px; display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"color:#834E5C; display:flex; padding-top:2px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div style=\"font-size:14px; font-weight:600\">Insights and coach chat first<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">They are still in development — waitlist members get access as they land.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF; padding:15px 16px; display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"color:#834E5C; display:flex; padding-top:2px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div style=\"font-size:14px; font-weight:600\">Nutrition, movement, sleep and mood tracking, free<\u002Fdiv><div style=\"font-size:12.5px; color:#6E5259; margin-top:2px\">Premium adds meal photo and barcode scanning.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- footer -->\n  <div style=\"border-top:1px solid #E7D9D4; background:#FDF7F5\">\n    <div style=\"max-width:1160px; margin:0 auto; padding:44px 32px 60px; display:flex; flex-direction:column; gap:26px\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap\">\n        <div style=\"display:flex; align-items:center; gap:9px\">\n          <div style=\"width:24px; height:24px; border-radius:999px; background:#834E5C; display:flex; align-items:center; justify-content:center; color:#FFFFFF\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14.6 2.6l1.3-1.3 1.4 1.4-1.3 1.3 3.9 3.9 1.3-1.3 1.4 1.4-1.3 1.3-1.6-1.6-1.7 1.7 1 1-1.5 1.5-1-1-6.3 6.3-4.4 1.4 1.4-4.4 6.3-6.3-1-1 1.5-1.5 1 1 1.7-1.7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:16px; font-weight:700; letter-spacing:-0.02em\">Embla<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:22px; flex-wrap:wrap\">\n          <a href=\"#privacy\" style=\"font-size:13.5px; font-weight:600; color:#6E5259\">Privacy<\u002Fa>\n          <a href=\"#waitlist\" style=\"font-size:13.5px; font-weight:600; color:#6E5259\">Terms<\u002Fa>\n          <a href=\"#waitlist\" style=\"font-size:13.5px; font-weight:600; color:#6E5259\">Support<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:#E7D9D4\"><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px; max-width:720px\">\n        <div style=\"font-size:13px; font-weight:600; color:#3D3238\">Embla is a tracking tool, not a substitute for your GP, prescriber or care team. If something feels wrong, physically or otherwise, please talk to one of them rather than to an app.<\u002Fdiv>\n        <div style=\"font-size:12.5px; font-weight:500; color:#6E5259; line-height:1.6\">Nutrition figures in the app are estimates. Embla is not affiliated with any medication manufacturer. Questions, or want to know what we store? <a href=\"mailto:hello@embla.app\" style=\"font-weight:600\">hello@embla.app<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
